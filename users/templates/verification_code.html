{% extends "base.html" %}

{% block title %}Verification - Bookstore{% endblock %}

{% block content %}

<form method="post" action="{% url 'verify_code' %}" class="general-form">
    {% csrf_token %}
    {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
    {% endif %}
    <div class="input-group general-input-group">
        <label class="input-label">Enter Verification Code</label>
            <input type="text" name="code" placeholder="Enter Verification Code" class="form-control mb-30"/>
        <div>
            <button type="submit" class="btn btn-primary mr-5 mb-15 res-block">Verify</button>
        </div>
    </div>
</form>

{% endblock %}
