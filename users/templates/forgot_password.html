{% extends "base.html" %}

{% block title %}Forgot password - Bookstore{% endblock %}

{% block content %}

<div class="text-center">
    <h1 class="mb-30">Forgot your password?</h1>
    <p class="general-password-text">We'll email you instructions on how to reset it</p>
</div>
<form method="post" action="{% url 'forgot_password' %}" class="general-form">
    {% csrf_token %}

    {% if forgot_password_error %}
        <div class="alert alert-danger">
            {{ forgot_password_error }}
        </div>
    {% endif %}

    <div class="form-group mb-25">
        <input id="email" name="email" type="email" placeholder="Enter your email" class="form-control"/>
    </div>
    <button class="btn btn-default center-block mb-20">Email Instructions</button>
    <div class="text-center">
        <a href="{% url 'login' %}" class="in-gold-500 mb-20">Cancel</a>
    </div>
</form>

{% endblock %}
